packages:
  - apps/*
  - packages/*
  - tools/*

catalog:
  "@codemirror/commands": ^6.10.3
  "@codemirror/language": ^6.12.3
  "@codemirror/state": ^6.6.0
  "@codemirror/view": ^6.41.1
  "@lezer/common": ^1.5.2
  "@lezer/generator": ^1.8.0
  "@lezer/highlight": ^1.2.3
  "@lezer/lr": ^1.4.10
  "@types/node": ^24
  es-toolkit: ^1.46.0
  prettier: ^3.8.3
  type-fest: ^5.6.0
  typescript: ^5
  vite: npm:@voidzero-dev/vite-plus-core@latest
  vite-plus: latest
  vitest: npm:@voidzero-dev/vite-plus-test@latest
  zod: ^4.3.6

catalogMode: prefer
overrides:
  vite: "catalog:"
  vitest: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
    - vitest
  allowedVersions:
    vite: "*"
    vitest: "*"
